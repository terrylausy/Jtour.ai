<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="480" height="100">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2d5a87"/>
    </linearGradient>
    <linearGradient id="jtourGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#3498db"/>
    </linearGradient>
  </defs>
  
  <!-- Globe Circle -->
  <circle cx="45" cy="50" r="38" fill="url(#globeGrad)" opacity="0.08"/>
  
  <!-- Globe Latitudes -->
  <ellipse cx="45" cy="50" rx="38" ry="14" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="45" cy="32" rx="30" ry="9" fill="none" stroke="#1e3a5f" stroke-width="1.2" opacity="0.7"/>
  <ellipse cx="45" cy="68" rx="30" ry="9" fill="none" stroke="#1e3a5f" stroke-width="1.2" opacity="0.7"/>
  
  <!-- Globe Longitudes -->
  <ellipse cx="45" cy="50" rx="14" ry="38" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.9"/>
  <line x1="45" y1="12" x2="45" y2="88" stroke="#1e3a5f" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Plane Icon -->
  <g transform="translate(28, 32) rotate(-25)">
    <path d="M0,8 L22,4 L20,8 L22,4 L22,2 L9,0 L6,3 L0,8 M6,8 L6,13 L9,11 L6,8" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  
  <!-- Flight Path Arc -->
  <path d="M18,58 Q45,30 72,52" fill="none" stroke="#3498db" stroke-width="2.5" stroke-dasharray="5,3" opacity="0.9"/>
  
  <!-- Text: JTOUR (Blue) -->
  <text x="100" y="42" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="url(#jtourGrad)" letter-spacing="1">JTOUR</text>
  
  <!-- Text: GLOBAL LOGISTICS (Dark Blue) -->
  <text x="100" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#1e3a5f" letter-spacing="3">GLOBAL LOGISTICS</text>
  
  <!-- Text: 杰途国际物流 (Orange/Yellow) -->
  <!-- 橙色 #e67e22 或金黄色 #f39c12 -->
  <text x="100" y="85" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="bold" fill="#e67e22" letter-spacing="2">杰途国际物流</text>
</svg>